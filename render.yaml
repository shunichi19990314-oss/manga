services:
  - type: web
    name: miuraw-proxy
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /__health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: TARGET_ORIGIN
        value: https://miuraw.net