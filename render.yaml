services:
  - type: web
    name: manga-clean
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      # 任意: 特定ホストだけ許可する場合
      # - key: UPSTREAM_ALLOW
      #   value: "mangaruu.com,miuraw.net,soraraw.com"