services:
  - type: web
    name: miuraw-proxy
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /__health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: BLOCK_ADS
        value: "1"
      - key: DIRECT_IMG
        value: "0"